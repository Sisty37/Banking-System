<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Beneficiary Manager</title>
  <link rel="stylesheet" href="../../Styles/FundTransfers/BeneficiaryManager.css" />
</head>
<body>
  <div class="container">
    <h2 class="heading">Beneficiary Manager</h2>
    <div class="form-card">
      <form>
        <div class="form-group">
          <label for="beneficiaryName" class="form-label">Beneficiary Name</label>
          <input type="text" class="form-control" id="beneficiaryName" required />
        </div>
        <div class="form-group">
          <label for="beneficiaryAccount" class="form-label">Account Number</label>
          <input type="text" class="form-control" id="beneficiaryAccount" required />
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-submit">Add Beneficiary</button>
        </div>
      </form>
    </div>

    <h5>Saved Beneficiaries</h5>
    <ul class="list">
      <li>
        Jane Doe - 222334455
        <button class="btn btn-remove">Remove</button>
      </li>
      <li>
        John Smith - 554433221
        <button class="btn btn-remove">Remove</button>
      </li>
    </ul>
  </div>
  <script src="../../JS/FundTransfers.js"></script>
</body>
</html>
