<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CD Compare</title>
  <link rel="stylesheet" href="../../Styles/InterestCalculator/CDCompare.css">
</head>
<body>
  <h2>CD Term Comparison</h2>
  <form>
    <label for="principal">Principal Amount:</label>
    <input type="number" id="principal" required /><br><br>

    <label for="term1">Term 1 (months):</label>
    <input type="number" id="term1" required />
    <label for="rate1">Rate 1 (%):</label>
    <input type="number" step="0.01" id="rate1" required /><br><br>

    <label for="term2">Term 2 (months):</label>
    <input type="number" id="term2" required />
    <label for="rate2">Rate 2 (%):</label>
    <input type="number" step="0.01" id="rate2" required /><br><br>

    <button type="submit">Compare Terms</button>
  </form>

  <hr>
  <p>
    <a href="SavingsProjector.html">Back to Savings Projector</a> |
    <a href="LoanSavings.html">Go to Loan Savings</a>
  </p>
  <script src="../../JS/interestcalculator.js"></script>
</body>
</html>
