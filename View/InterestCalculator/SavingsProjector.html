<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Savings Projector</title>
  <link rel="stylesheet" href="../../Styles/InterestCalculator/SavingsProjector.css">
</head>
<body>
  <h2>Savings Projector</h2>
  <form>
    <label for="initialAmount">Initial Amount:</label>
    <input type="number" id="initialAmount" required /><br><br>

    <label for="monthlyContribution">Monthly Contribution:</label>
    <input type="number" id="monthlyContribution" required /><br><br>

    <label for="interestRate">Annual Interest Rate (%):</label>
    <input type="number" step="0.01" id="interestRate" required /><br><br>

    <label for="years">Years:</label>
    <input type="number" id="years" required /><br><br>

    <button type="submit">Forecast Growth</button>
  </form>

  <hr>
  <p>
    <a href="CDCompare.html">Compare CD Options</a> |
    <a href="LoanSavings.html">Calculate Loan Savings</a>
  </p>
  <script src="../../JS/interestcalculator.js"></script>
</body>
</html>
