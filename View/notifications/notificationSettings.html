<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notification Settings</title>
  <link rel="stylesheet" href="../../Styles/notification/notificationSettings.css">
</head>
<body>
  <div class="container">
    <h2>Notification Settings</h2>
    <form>
      <div class="toggle-wrap">
        <input type="checkbox" id="emailToggle" checked>
        <label for="emailToggle">Email Notifications</label>
      </div>
      <div class="toggle-wrap">
        <input type="checkbox" id="pushToggle">
        <label for="pushToggle">Push Notifications</label>
      </div>
      <button type="submit" class="save-btn">Save Settings</button>
    </form>
  </div>
  <script src="../../JS/notification.js"></script>
</body>
</html>
