<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notification Center</title>
  <link rel="stylesheet" href="../../Styles/notification/notificationCenter.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>Notification Center</h2>
      <div class="icon-wrap">
        <span class="icon">🔔</span>
        <span id="unreadCount" class="badge">3</span>
      </div>
    </div>

    <ul id="notificationList">
      <li>
        Transfer of $500 to Jane completed.
        <button class="mark-read">Mark as Read</button>
      </li>
      <li>
        Monthly savings goal updated.
        <button class="mark-read">Mark as Read</button>
      </li>
      <li>
        Statement is available to download.
        <button class="mark-read">Mark as Read</button>
      </li>
    </ul>
  </div>

  <script src="../../JS/notification.js"></script>
</body>
</html>
