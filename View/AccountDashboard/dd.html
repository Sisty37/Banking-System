<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Dashboard</title>
  <link rel="stylesheet" href="css/account-dashboard.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="dashboard-container container mt-5">
    <h2 class="text-center mb-4">Account Dashboard</h2>

    <!-- Summary Section -->
    <div class="row mb-4">
      <div class="col-md-4">
        <div class="summary-tile bg-primary text-white">
          <h4>Total Balance</h4>
          <p>$15,320.55</p>
        </div>
      </div>
      <div class="col-md-4">
        <div class="summary-tile bg-success text-white">
          <h4>Savings Account</h4>
          <p>$9,500.00</p>
        </div>
      </div>
      <div class="col-md-4">
        <div class="summary-tile bg-warning text-white">
          <h4>Checking Account</h4>
          <p>$5,820.55</p>
        </div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="quick-actions text-center mb-4">
      <button class="btn btn-outline-primary me-2">Transfer Funds</button>
      <button class="btn btn-outline-success me-2">Pay Bills</button>
      <button class="btn btn-outline-danger">Download Statement</button>
    </div>

    <!-- Account List -->
    <div class="card-list">
      <div class="card account-card mb-3">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <h5>Primary Checking</h5>
            <p class="mb-0">Account #: 123456789</p>
          </div>
          <div>
            <span class="balance">$3,200.55</span>
          </div>
        </div>
      </div>

      <div class="card account-card mb-3">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <h5>High-Yield Savings</h5>
            <p class="mb-0">Account #: 987654321</p>
          </div>
          <div>
            <span class="balance">$12,120.00</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
