<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password</title>
</head>
<body>
  <h2>Reset Password</h2>
  <form action="/reset-password" method="POST" onsubmit="validateResetPasswordForm(event) ">
    <input type="password" name="new_password" placeholder="New Password" required><br><br>
    <input type="password" name="confirm_new_password" placeholder="Confirm New Password" required><br><br>
    <button type="submit">Set New Password</button>
  </form>

  <!-- Link the validation.js file here -->
  <script src="UserAuthentication.js"></script>
</body>
</html>
