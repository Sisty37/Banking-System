<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
</head>
<body>
  <h2>Login</h2>

  <form action="/login" method="POST" onsubmit="validateLoginForm(event)">
    <input type="email" id="login-email" name="email" placeholder="Email" required><br><br>
    <input type="password" id="login-password" name="password" placeholder="Password" required><br><br>
    <p><a href="/forgot-password">Forgot Password?</a></p>
    <button type="submit">Login</button>
  </form>

  <p><a href="/signup">Don't have an account? Signup</a></p>

  <!-- Link the validation.js file here -->
  <script src="UserAuthentication.js"></script>
</body>
</html>
